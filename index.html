<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#14312e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Flashscapes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png">
<title>Flashscapes</title>
<style>
:root{color-scheme:dark light;--top:#14312e;--bot:#0b1a19;--tile:#e8d9b5;--ink:#1d1d1d;--hit:#e0a82e;--slot:#ffffff1a;--panel:#00000055;--wheel:#26302f;--wl:#e9eeee;--sel:#e8d9b5;--selink:#1d1d1d;--line:#e8d9b5;--btn:#2d3a39;--btnink:#e9eeee;--fg:#e9eeee}
@media(prefers-color-scheme:light){:root{--top:#2a9d8f;--bot:#1f6f5c;--tile:#f5e6c4;--hit:#ffd166;--slot:#ffffff40;--panel:#0003;--wheel:#fff;--wl:#2b2b2b;--sel:#2b2b2b;--selink:#fff;--line:#2b2b2b;--btn:#fff;--btnink:#2b2b2b;--fg:#fff}}
*{box-sizing:border-box;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html{background:var(--bot)}html,body{overscroll-behavior:none}body{margin:0;height:100vh;height:100dvh;overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);-webkit-tap-highlight-color:transparent;background:linear-gradient(var(--top),var(--bot));font-family:system-ui,sans-serif;color:var(--fg);display:flex;flex-direction:column;align-items:center}
header{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:480px;padding:10px 16px;font-weight:700}
#gridbox{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}#grid{display:grid;gap:3px;margin:8px 0;padding:8px;background:var(--panel);border-radius:10px}
.c{width:var(--s);height:var(--s);border-radius:5px;background:var(--slot);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:calc(var(--s)*.6);color:var(--ink)}
.c.on{background:var(--tile)}.c.hint{background:var(--hit)}
#pm{height:38px;flex:none;position:relative;display:flex;justify-content:center;align-items:center}#preview{display:flex;gap:4px;align-items:center}#preview:not(:empty)+#msg{display:none}
#preview span{background:var(--tile);color:var(--ink);font-weight:700;padding:2px 9px;border-radius:6px;font-size:20px}
#msg{font-size:14px;opacity:.9;text-align:center}
#wheel{touch-action:none;position:relative;margin:6px auto;border-radius:50%;background:var(--wheel);flex:none}
#wheel canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.l{position:absolute;width:var(--b);height:var(--b);margin:calc(var(--b)/-2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:calc(var(--b)*.55);font-weight:700;color:var(--wl);cursor:pointer}
.l.sel{background:var(--sel);color:var(--selink)}
#bar{display:flex;justify-content:center;gap:8px;margin:2px 8px 10px}#bar button{padding:0 14px;font-size:14px;white-space:nowrap}
button{background:var(--btn);color:var(--btnink);border:0;border-radius:24px;min-height:44px;padding:0 18px;font-weight:700;font-size:15px;cursor:pointer}
#def,#hist{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:24px;z-index:2}#def{z-index:4}#def>div,#hist>div{background:var(--wheel);color:var(--wl);border-radius:14px;padding:18px 20px;max-width:420px;max-height:80vh;overflow:auto;font-size:15px;line-height:1.4;-webkit-user-select:none}#def h3{margin:0 0 6px;font-size:22px}#def i{opacity:.7}#def p{margin:6px 0}#def a{color:inherit}textarea{-webkit-user-select:text;user-select:text;font-size:16px;background:var(--btn);color:var(--btnink);border:1px solid #8884;border-radius:8px;padding:8px;word-break:break-all}.c.on{cursor:pointer}.lnk{background:none;color:inherit;font:inherit;padding:0 4px;min-height:44px;border-radius:0;text-decoration:underline dotted;text-underline-offset:4px}#hist{display:none}#hist h3{font-size:16px;margin:12px 0 4px}.chip{display:inline-block;margin:3px;padding:6px 12px;border-radius:16px;background:var(--btn);color:var(--btnink);cursor:pointer;font-weight:600;border:1px solid #8884}.chip.b{border-style:dashed}
#win{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-size:28px;font-weight:700}
</style>
</head>
<body>
<header><span>Level <b id="lv"></b></span><span>🪙 <b id="coins"></b></span><button class="lnk" id="bonusb">Bonus <b id="bn"></b></button></header>
<div id="gridbox"><div id="grid"></div></div>
<div id="pm"><div id="preview"></div><div id="msg"></div></div>
<div id="wheel"><canvas></canvas></div>
<div id="bar"><button id="shuf">Shuffle</button><button id="hint">Hint (10🪙)</button><button id="menub">☰ Menu</button></div>
<div id="hist"><div></div></div>
<div id="def"><div></div></div>
<div id="win"><div>Level complete!</div><button id="next">Next level</button></div>
<script src="levels.js?v=__V__"></script>
<script>
const V = '__V__';
async function checkUpdate() {
  if (V.startsWith('__')) return;
  try {
    const { v } = await (await fetch('version.json?t=' + Date.now(), { cache: 'no-store' })).json();
    if (v !== V && sessionStorage.getItem('upd') !== v) { sessionStorage.setItem('upd', v); location.replace(location.pathname + '?v=' + v); }
  } catch { }
}
checkUpdate();
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
const free = (e) => e.target.tagName === 'TEXTAREA';
addEventListener('contextmenu', (e) => free(e) || e.preventDefault());
addEventListener('selectstart', (e) => free(e) || e.preventDefault());
addEventListener('gesturestart', e => e.preventDefault());
let lastTap = 0;
addEventListener('touchend', e => { const n = Date.now(); if (n - lastTap < 350) e.preventDefault(); lastTap = n; }, { passive: false });
const $ = id => document.getElementById(id);
let save = { lv: 0, coins: 20 };
try { save = { ...save, ...JSON.parse(localStorage.getItem('flashscapes')) }; } catch { }
save.found ||= []; save.bonus ||= []; save.hints ||= []; save.hist ||= [];
const animOn = () => save.anim ?? !matchMedia('(prefers-reduced-motion: reduce)').matches;
let W, done, L, cells, found, bonusFound, sel = [], letters, pos;
const persist = () => { try { localStorage.setItem('flashscapes', JSON.stringify(save)); } catch { } };

function load() {
  const [l, ws] = LEVELS[save.lv % LEVELS.length].split(':');
  const p = ws.split(',').map((x) => [x.slice(0, -3), +x[x.length - 3], +x[x.length - 2], +x[x.length - 1]]);
  L = { l, p, h: Math.max(...p.map((q) => q[1] + (q[3] ? q[0].length : 1))), w: Math.max(...p.map((q) => q[2] + (q[3] ? 1 : q[0].length))) };
  done = false; found = new Set(); bonusFound = new Set(); cells = {};
  $('win').style.display = 'none';
  const g = $('grid'); g.innerHTML = '';
  g.style.setProperty('--s', '1px'); g.style.gridTemplateColumns = `repeat(${L.w},var(--s))`; fit();
  for (let r = 0; r < L.h; r++) for (let c = 0; c < L.w; c++) {
    const d = document.createElement('div'); d.className = 'c'; g.appendChild(d); cells[r + ',' + c] = { d, ch: null };
  }
  for (const [w, r, c, v] of L.p) for (let i = 0; i < w.length; i++) { const q = cells[(r + (v ? i : 0)) + ',' + (c + (v ? 0 : i))]; q.ch = w[i]; (q.words ||= []).push(w); }
  for (const k in cells) if (!cells[k].ch) cells[k].d.style.visibility = 'hidden';
  for (const w of save.found) { const m = L.p.find(p => p[0] === w); if (m) { found.add(w); reveal(m); } }
  save.bonus.forEach(w => bonusFound.add(w));
  save.hints.forEach(k => cells[k] && show(k, 'hint'));
  letters = [...L.l]; buildWheel(); fit(); stats();
}
function fly(m, idxs) {
  const snap = cells, [w, r0, c0, v] = m;
  let pending = 0;
  for (let i = 0; i < w.length; i++) {
    const k = (r0 + (v ? i : 0)) + ',' + (c0 + (v ? 0 : i)), c = snap[k];
    if (c.d.classList.contains('on')) continue;
    if (!animOn()) { show(k); continue; }
    const t = c.d.getBoundingClientRect(), s = pos[idxs[i]].e.getBoundingClientRect(), f = document.createElement('div');
    f.className = 'c on';
    f.textContent = w[i].toUpperCase();
    Object.assign(f.style, { position: 'fixed', left: t.left + 'px', top: t.top + 'px', width: t.width + 'px', height: t.height + 'px', fontSize: t.width * .6 + 'px', zIndex: 3, pointerEvents: 'none' });
    document.body.appendChild(f); pending++;
    f.animate([{ transform: `translate(${s.left - t.left}px,${s.top - t.top}px) scale(${s.width / t.width})` }, { transform: 'none' }], { duration: 450, delay: i * 70, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' }).onfinish = () => {
      f.remove();
      if (snap !== cells) return;
      show(k);
      if (!--pending) checkDone();
    };
  }
  if (!pending) checkDone();
}
function reveal(m) { for (let i = 0; i < m[0].length; i++) show((m[1] + (m[3] ? i : 0)) + ',' + (m[2] + (m[3] ? 0 : i))); }
function fit() {
  const bx = $('gridbox').getBoundingClientRect(), s = Math.max(14, Math.min(46, Math.floor((bx.width - 24) / L.w) - 3, Math.floor((bx.height - 24) / L.h) - 3));
  $('grid').style.setProperty('--s', s + 'px');
}
function stats() { $('lv').textContent = save.lv + 1; $('coins').textContent = save.coins; $('bn').textContent = bonusFound.size; }
function show(k, cls) { const c = cells[k]; c.d.textContent = c.ch.toUpperCase(); c.d.classList.add('on'); if (cls) c.d.classList.add(cls); }

function buildWheel() {
  const w = $('wheel'); w.querySelectorAll('.l').forEach(e => e.remove());
  W = Math.max(180, Math.min(300, innerWidth - 48, innerHeight * .33));
  w.style.width = w.style.height = W + 'px'; w.style.setProperty('--b', Math.min(64, W / 4.2) + 'px');
  const cvs = w.querySelector('canvas'), d = devicePixelRatio || 1; cvs.width = cvs.height = W * d; cvs.getContext('2d').setTransform(d, 0, 0, d, 0, 0);
  pos = letters.map((ch, i) => {
    const a = 2 * Math.PI * i / letters.length - Math.PI / 2;
    const x = W / 2 + W * .355 * Math.cos(a), y = W / 2 + W * .355 * Math.sin(a);
    const e = document.createElement('div'); e.className = 'l'; e.textContent = ch.toUpperCase();
    e.style.left = x + 'px'; e.style.top = y + 'px'; w.appendChild(e);
    return { x, y, e, ch };
  });
}
function draw(p) {
  const cv = $('wheel').querySelector('canvas').getContext('2d');
  cv.clearRect(0, 0, W, W);
  if (!sel.length) return;
  cv.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--line'); cv.lineWidth = 8; cv.lineCap = cv.lineJoin = 'round'; cv.beginPath();
  sel.forEach((i, n) => n ? cv.lineTo(pos[i].x, pos[i].y) : cv.moveTo(pos[i].x, pos[i].y));
  if (p) cv.lineTo(p.x, p.y);
  cv.stroke();
}
function preview() {
  $('preview').innerHTML = sel.map(i => `<span>${pos[i].e.textContent}</span>`).join('');
  pos.forEach((p, i) => p.e.classList.toggle('sel', sel.includes(i)));
}
function pt(ev) { const r = $('wheel').getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; }
function hit(p) { return pos.findIndex(q => Math.hypot(q.x - p.x, q.y - p.y) < W * .13); }

const wheel = $('wheel');
wheel.addEventListener('pointerdown', ev => { wheel.setPointerCapture(ev.pointerId); const i = hit(pt(ev)); sel = i < 0 ? [] : [i]; $('msg').textContent = ''; preview(); draw(pt(ev)); });
wheel.addEventListener('pointermove', ev => {
  if (!sel.length) return;
  const p = pt(ev), i = hit(p);
  if (i >= 0) {
    if (sel.length > 1 && i === sel[sel.length - 2]) sel.pop();
    else if (!sel.includes(i)) sel.push(i);
  }
  preview(); draw(p);
});
wheel.addEventListener('pointerup', () => { const idxs = sel, w = idxs.map(i => pos[i].ch).join(''); sel = []; preview(); draw(); if (w.length) submit(w, idxs); });

function submit(w, idxs) {
  const m = L.p.find(p => p[0] === w);
  if (m) {
    if (found.has(w)) return flash('Already found');
    found.add(w);
    save.found.push(w); persist(); fly(m, idxs);
  } else if (w.length >= 3 && DICT.has(w) && fitsWheel(w)) {
    if (bonusFound.has(w)) return flash('Already found');
    bonusFound.add(w); save.bonus.push(w); save.coins += 2; persist(); stats(); flash('Bonus word! +2🪙');
  } else flash(w.length < 3 ? 'Too short' : 'Not a word');
}
function fitsWheel(w) { const c = {}; for (const ch of L.l) c[ch] = (c[ch] || 0) + 1; for (const ch of w) if (!c[ch]--) return false; return true; }
const defs = {};
const html = (t) => new DOMParser().parseFromString(t, 'text/html').body.textContent;
const row = (pos, d) => `<p><i>${pos}</i> ${d}</p>`;
const sources = [
  (w) => fetch('https://api.dictionaryapi.dev/v2/entries/en/' + w).then((r) => r.ok ? r.json() : Promise.reject()).then((j) => j[0].meanings.slice(0, 3).map((m) => row(m.partOfSpeech, m.definitions[0].definition)).join('')),
  (w) => fetch('https://en.wiktionary.org/api/rest_v1/page/definition/' + w).then((r) => r.ok ? r.json() : Promise.reject()).then((j) => j.en.slice(0, 3).map((m) => row(m.partOfSpeech, html(m.definitions[0].definition))).join('')),
];
async function lookup(w) {
  if (!defs[w]) {
    defs[w] = (async () => {
      for (const src of sources) { try { const t = await src(w); if (t) return t; } catch { } }
      delete defs[w];
      return `<p>No definition found. <a href="https://en.wiktionary.org/wiki/${w}" target="_blank" rel="noopener">Wiktionary</a></p>`;
    })();
  }
  return defs[w];
}
async function showDef(ws) {
  const box = $('def'), body = box.firstElementChild; box.style.display = 'flex';
  body.innerHTML = ws.map((w) => `<h3>${w}</h3><p>…</p>`).join('');
  body.innerHTML = (await Promise.all(ws.map(async (w) => `<h3>${w}</h3>${await lookup(w)}`))).join('');
}
$('grid').addEventListener('click', (ev) => {
  const i = [...$('grid').children].indexOf(ev.target);
  if (i < 0) return;
  const ws = (cells[Math.floor(i / L.w) + ',' + (i % L.w)].words || []).filter((w) => found.has(w));
  if (ws.length) showDef(ws);
});
const chips = (a, c) => a.filter((w) => /^[a-z]{3,7}$/.test(w)).map((w) => `<span class="chip ${c}" data-w="${w}">${w}</span>`).join('');
function showHist() {
  const groups = [...(done || !(found.size + bonusFound.size) ? [] : [{ lv: save.lv + 1, w: [...found], b: [...bonusFound], cur: 1 }]), ...save.hist];
  $('hist').firstElementChild.innerHTML = groups.length ? groups.map((g) => `<h3>Level ${g.lv}${g.cur ? ' (current)' : ''}</h3>${chips(g.w, '')}${chips(g.b, 'b')}`).join('') + '<p><i>Dashed = bonus words. Tap a word for its definition.</i></p>' : '<p>No words yet.</p>';
  $('hist').style.display = 'flex';
}
$('hist').onclick = (ev) => { const w = ev.target.dataset.w; if (w) showDef([w]); else if (ev.target === $('hist')) $('hist').style.display = 'none'; };
$('bonusb').onclick = () => {
  $('hist').firstElementChild.innerHTML = bonusFound.size ? `<h3>Bonus words, level ${save.lv + (done ? 0 : 1)}</h3>${chips([...bonusFound], 'b')}<p><i>Tap a word for its definition.</i></p>` : '<p>No bonus words found on this level yet.</p>';
  $('hist').style.display = 'flex';
};
const animLabel = () => $('anim').textContent = 'Motion: ' + (animOn() ? 'On' : 'Off');
$('def').onclick = () => $('def').style.display = 'none';
function flash(t) { $('msg').textContent = t; }
function win() { if (done) return; done = true; save.hist.unshift({ lv: save.lv + 1, w: L.p.map((q) => q[0]), b: [...bonusFound] }); save.hist.length = Math.min(save.hist.length, 5); save.lv++; save.coins += 5; save.found = []; save.bonus = []; save.hints = []; persist(); stats(); setTimeout(() => $('win').style.display = 'flex', 500); }

$('shuf').onclick = () => {
  const perm = letters.map((_, i) => i), old = pos.map(p => ({ x: p.x, y: p.y }));
  for (let i = perm.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
  letters = perm.map(i => letters[i]); buildWheel();
  if (animOn()) pos.forEach((p, j) => p.e.animate([{ transform: `translate(${old[perm[j]].x - p.x}px,${old[perm[j]].y - p.y}px)` }, { transform: 'none' }], { duration: 250, easing: 'ease-in-out' }));
};
const hintLabel = $('hint').textContent;
let armed = 0;
const disarm = () => { clearTimeout(armed); armed = 0; $('hint').textContent = hintLabel; };
$('hint').onclick = () => {
  const open = Object.keys(cells).filter(k => cells[k].ch && !cells[k].d.classList.contains('on'));
  if (!open.length) return;
  if (save.coins < 10) return flash('Need 10 coins');
  if (!armed) { $('hint').textContent = 'Tap again to confirm'; armed = setTimeout(disarm, 2500); return; }
  disarm();
  save.coins -= 10; persist(); stats(); { const k = open[Math.floor(Math.random() * open.length)]; save.hints.push(k); persist(); show(k, 'hint'); }
  checkDone();
};
function checkDone() { if (Object.keys(cells).every(k => !cells[k].ch || cells[k].d.classList.contains('on')) ) win(); }
$('next').onclick = load;
const panel = (html) => { $('hist').firstElementChild.innerHTML = html; $('hist').style.display = 'flex'; };
function showMenu() {
  panel('<h3>Menu</h3><p><button id="m-words">Recent words</button></p><p><button id="anim"></button></p><p><button id="m-backup">Backup / restore progress</button></p><p><button id="wipe">Reset all progress</button></p><p><button id="shut">Close</button></p>');
  animLabel();
  $('m-words').onclick = showHist;
  $('anim').onclick = () => { save.anim = !animOn(); persist(); animLabel(); };
  $('m-backup').onclick = showBackup;
  $('wipe').onclick = () => { if (confirm('Reset all progress?')) { localStorage.removeItem('flashscapes'); location.reload(); } };
  $('shut').onclick = () => $('hist').style.display = 'none';
}
function showBackup() {
  panel('<h3>Progress backup</h3><p>Safari and the home-screen app keep separate saves. Copy the code here, paste it into the other one, and tap Load.</p><textarea id="code" rows="5" style="width:100%"></textarea><p><button id="copy">Copy</button> <button id="load">Load</button> <button id="back">Back</button></p><p id="dmsg"></p>');
  $('code').value = 'FS1:' + btoa(JSON.stringify(save));
  const msg = (t) => $('dmsg').textContent = t;
  $('copy').onclick = async () => { try { await navigator.clipboard.writeText($('code').value); msg('Copied.'); } catch { $('code').select(); msg('Select the code and copy it.'); } };
  $('load').onclick = () => {
    try {
      const o = JSON.parse(atob($('code').value.trim().replace(/^FS1:/, '')));
      if (!Number.isInteger(o.lv) || o.lv < 0 || typeof o.coins !== 'number') throw 0;
      for (const k of ['found', 'bonus', 'hints', 'hist']) if (!Array.isArray(o[k])) o[k] = [];
      localStorage.setItem('flashscapes', JSON.stringify(o)); location.reload();
    } catch { msg('Invalid code.'); }
  };
  $('back').onclick = showMenu;
}
$('menub').onclick = showMenu;
addEventListener('resize', () => { if (!sel.length) { buildWheel(); fit(); } });
load();
</script>
</body>
</html>
